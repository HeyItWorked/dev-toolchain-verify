name: verify-toolchain
on: [push, workflow_dispatch]

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: macOS install (containers skipped - no nested virt)
        env:
          SKIP_CONTAINERS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: bash install-macos.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Windows install (Docker Desktop skipped)
        shell: pwsh
        run: ./install-windows.ps1 -SkipDocker
