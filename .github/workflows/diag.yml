name: diag
on: [push, workflow_dispatch]

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: winget dbeaver after source update
        continue-on-error: true
        shell: pwsh
        run: |
          winget source update
          "update-exit=$LASTEXITCODE"
          winget search dbeaver --source winget --accept-source-agreements
          "search-exit=$LASTEXITCODE"
          foreach ($id in 'DBeaver.DBeaverCommunity','DBeaver.DBeaver','dbeaver.dbeaver') {
            winget show --id $id -e --source winget --accept-source-agreements *> $null
            "$id exit=$LASTEXITCODE"
          }
